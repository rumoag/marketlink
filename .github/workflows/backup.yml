name: Copia de seguridad

# Copia logica diaria de la base (RPO 24 h), cifrada. Se omite mientras no esten los secretos.
# La restauracion se prueba con el escenario R-01 (docs/runbooks/restauracion.md).
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Comprobar secretos
        id: check
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            # U7 (BR7-CP1): con BACKUP_REQUIRED=true (antes de M2) la copia no puede omitirse.
            if [ "${{ vars.BACKUP_REQUIRED }}" = "true" ]; then
              echo "::error::BACKUP_REQUIRED=true pero faltan los secretos de la copia."
              exit 1
            fi
            echo "::notice::Secretos de copia no configurados: se omite."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Volcado cifrado
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          docker run --rm -e DB_URL="$BACKUP_DATABASE_URL" postgres:17 \
            sh -c 'pg_dump "$DB_URL" --no-owner --no-privileges --format=custom' \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                  --passphrase-fd 3 --output marketlink.dump.gpg 3<<<"$BACKUP_PASSPHRASE"
          sha256sum marketlink.dump.gpg > marketlink.dump.gpg.sha256
          ls -l marketlink.dump.gpg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.configured == 'true'
        with:
          name: backup-${{ github.run_id }}
          path: |
            marketlink.dump.gpg
            marketlink.dump.gpg.sha256
          retention-days: 30
          if-no-files-found: error
      # U7 (BR7-CP3): anota la copia para la pantalla de salud. Si el rol de la copia es de solo
      # lectura la insercion falla, se avisa y la copia sigue siendo valida («sin dato» en el panel).
      - name: Registrar la copia
        if: steps.check.outputs.configured == 'true'
        continue-on-error: true
        run: |
          SIZE=$(stat -c%s marketlink.dump.gpg)
          SUM=$(cut -d' ' -f1 marketlink.dump.gpg.sha256)
          docker run --rm -e DB_URL="$BACKUP_DATABASE_URL" postgres:17 \
            sh -c "psql \"\$DB_URL\" -v ON_ERROR_STOP=1 -c \"INSERT INTO backup_runs (size_bytes, checksum) VALUES ($SIZE, '$SUM')\"" \
            || echo "::warning::No se pudo registrar la copia en backup_runs (rol de solo lectura): el panel mostrara «sin dato»."
